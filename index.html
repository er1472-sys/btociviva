<!DOCTYPE html>
<html style="margin:0;padding:0;width:100%;height:100%;overflow:hidden;">
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden !important; 
        }
        body {
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .img-container {
            /* 設定固定的框架大小 */
            width: 520px;
            height: 370px;
            border: 1px solid #444; /* 選擇性：加個邊框方便觀察 */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        img {
            /* 讓圖片寬高都撐滿容器 */
            width: 100%;
            height: 100%;
            
            /* 關鍵：cover 會確保填滿 520x370 並維持比例，超出部分隱藏 */
            object-fit: cover; 
            
            border: none;
        }
    </style>
</head>
<body scroll="no" oncontextmenu="return false;">

    <div class="img-container">
        <img src="https://easyyoyo.wordpress.com/wp-content/uploads/2026/04/lineage_7.png">
    </div>

</body>
</html>
