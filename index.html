<!DOCTYPE html>
<html style="margin:0;padding:0;width:100%;height:100%;overflow:hidden;">
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden !important; 
        }
        body {
            width: 100vw;
            height: 100vh;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            /* 強制圖片寬度或高度填滿容器 */
            width: 100%;
            height: 100%;
            
            /* 關鍵：object-fit: contain 會讓圖片在維持比例的情況下，
               自動縮放至最大範圍，且不會被裁切 */
            object-fit: contain; 
            
            border: none;
        }
    </style>
</head>
<body scroll="no" oncontextmenu="return false;">

    <img src="https://easyyoyo.wordpress.com/wp-content/uploads/2026/04/lineage_9.jpg">

</body>
</html>
